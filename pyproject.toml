[project]
name = "ttrss-migration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg>=3.3.2",
    "psycopg-pool>=3.3.0",
    "pydantic>=2.12.5",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "ipdb>=0.13.13",
    "ipython>=9.4.0",
    "isort>=6.0.1",
    "mypy>=1.17.1",
    "pre-commit>=4.2.0",
    "ruff>=0.12.2",
    "types-tqdm>=4.67.0.20250516",
]

[tool.isort]
# Make isort compatible with black
profile = "black"
# Additional custom settings
force_sort_within_sections = true
default_section = "THIRDPARTY"
# Add own libraries here
#known_first_party=
# When not using relative imports, add local package here
known_localproject = ["tests", "custom_logging", "migration"]
sections=["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALPROJECT", "LOCALFOLDER"]
